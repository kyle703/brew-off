name = "brew-off"
main = "worker/index.ts"
compatibility_date = "2025-09-19"

[assets]
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# ADMIN_PASSWORD and COOKIE_SECRET come from `.dev.vars` locally
# and `wrangler secret put` in production.

[[d1_databases]]
binding = "DB"
database_name = "brew-off"
database_id = "bc27dcc7-9edd-4c72-9b5e-7758b5170b5d"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "LABELS"
bucket_name = "brew-off-labels"

[observability.logs]
enabled = false
invocation_logs = true
